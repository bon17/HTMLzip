<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 프롬프트 특강</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* 학생 페이지 · 구형 갤럭시탭(크롬·삼성 인터넷)용: ES5 스크립트, 최신 CSS(color-mix, :is, flex gap) 쓰지 않음 */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#FFF8EE;color:#1C2340;font-family:'Nanum Gothic','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-weight:700;font-size:19px;line-height:1.5;word-break:keep-all;-webkit-text-size-adjust:100%}
.d{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:20;background:#1C2340;color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{font-size:20px}
.who{font-size:16px;opacity:.9}
.who a{color:#FFE58A;margin-left:8px;text-decoration:underline;cursor:pointer}
.scr{display:none}
.scr.on{display:block}
h1{margin:18px 0 4px;font-size:34px;line-height:1.2}
.lead{margin:0 0 14px;color:#4A5170}
.card{background:#fff;border:3px solid #1C2340;border-radius:22px;box-shadow:5px 5px 0 #1C2340;padding:18px 18px 20px;margin:18px 0}
.card h2{margin:0 0 6px;font-size:26px;line-height:1.25}
.card h2 .n{display:inline-block;width:38px;height:38px;line-height:38px;text-align:center;border-radius:50%;background:#C2410C;color:#fff;margin-right:8px;font-size:22px;vertical-align:2px}
.card.locked{opacity:.55}
.hint{color:#4A5170;font-size:16px;margin:4px 0 10px}
.btn{display:inline-block;border:0;border-radius:999px;background:#C2410C;color:#fff;padding:12px 22px;font-family:'Jua',sans-serif;font-weight:400;font-size:22px;text-decoration:none;text-align:center;margin:6px 8px 0 0;min-height:52px}
.btn.blue{background:#1E5BD8}
.btn.line{background:#fff;color:#1C2340;border:3px solid #1C2340;padding:9px 19px}
.btn.big{display:block;width:100%;margin:12px 0 0}
.btn[disabled]{opacity:.45;cursor:default}
.row2{display:flex;flex-wrap:wrap}
.row2 .btn{flex:1 1 200px}
.field{margin:12px 0}
.field label{display:block;font-size:16px;color:#4A5170;margin-bottom:4px}
.field input,.field select,textarea{width:100%;border:3px solid #DDE1EC;border-radius:14px;padding:10px 12px;background:#fff;font-size:22px}
textarea{min-height:150px;font-size:18px;line-height:1.5;resize:vertical}
.code-in{letter-spacing:.5em;text-align:center;font-family:'Jua',sans-serif;font-size:40px !important}
.two{display:flex}
.two > *{flex:1}
.two > * + *{margin-left:12px}
.msg{color:#C8291D;font-size:17px;min-height:1.5em;margin-top:6px}
/* 미션 */
.mtabs{display:flex;flex-wrap:wrap;margin:14px 0 0}
.mtabs button{border:2px solid #1C2340;background:#fff;border-radius:999px;padding:4px 14px;margin:0 6px 6px 0;font-family:'Jua',sans-serif;font-size:18px}
.mtabs button.on{background:#1C2340;color:#fff}
.mtabs button.done{border-color:#0B7A45;color:#0B7A45}
.mtabs button.on.done{background:#0B7A45;color:#fff}
.mbadge{display:inline-block;background:#C2410C;color:#fff;border-radius:999px;padding:2px 14px;font-size:18px;margin-top:14px}
.ing{display:inline-block;background:#FFE58A;border-radius:10px;padding:0 10px;margin-left:6px;font-size:18px}
.oneline{font-family:'Jua',sans-serif;font-size:30px;background:#F7F8FC;border:3px dashed #9AA0B5;border-radius:16px;padding:12px 16px;margin:8px 0;-webkit-user-select:text;user-select:text}
.slot{margin:12px 0 0}
.slot-l{font-family:'Jua',sans-serif;font-size:20px;margin-bottom:4px}
.slot-l small{font-family:'Nanum Gothic',sans-serif;font-size:14px;color:#4A5170;margin-left:6px}
.chips{display:flex;flex-wrap:wrap}
.chip{border:2px solid #1C2340;background:#fff;border-radius:999px;padding:6px 14px;margin:0 6px 7px 0;font-family:'Jua',sans-serif;font-size:19px;line-height:1.25;min-height:42px}
.chip.on{background:var(--c,#F2B48C);box-shadow:inset 0 0 0 2px #1C2340}
.dice{display:flex;align-items:center;justify-content:space-between;background:#FFF1E5;border:3px solid #C2410C;border-radius:18px;padding:10px 12px 10px 16px;margin:8px 0 4px}
.dice p{margin:0;font-size:17px}
.dice .btn{margin:0;flex:none}
.ico{width:1.1em;height:1.1em;vertical-align:-.18em;display:inline-block}
.prompt{background:#FFF8EE;border:3px solid #1C2340;border-radius:16px;padding:14px 16px;margin:14px 0 4px;font-size:20px;line-height:1.7;-webkit-user-select:text;user-select:text}
.prompt mark{background:transparent;background-image:linear-gradient(transparent 50%,var(--c,#FFE58A) 50%);color:inherit;padding:0 1px}
.prompt .miss{color:#C8291D;border-bottom:2px dashed #C8291D}
.safe{display:flex;align-items:flex-start;margin-top:12px;font-size:17px;background:#EAFBF2;border-radius:14px;padding:10px 12px}
.safe input{width:26px;height:26px;margin:2px 10px 0 0;flex:none}
.story .field{margin:8px 0}
.story .field input{font-size:19px}
.custom{margin-top:6px}
.custom input{width:100%;border:2px dashed #1C2340;border-radius:14px;padding:8px 12px;font-size:19px}
.upload{margin-top:14px;border-top:2px dashed #DDE1EC;padding-top:12px}
.upload h3{margin:0 0 6px;font-size:20px}
.pick{display:block;border:3px dashed #1E5BD8;border-radius:16px;padding:16px;text-align:center;color:#1E5BD8;font-family:'Jua',sans-serif;font-size:21px;cursor:pointer;background:#F4F8FF}
.pick input{display:none}
.preview{display:block;max-width:100%;max-height:300px;margin:10px auto 0;border-radius:12px;border:2px solid #1C2340}
.done-box{display:flex;align-items:center;background:#EAFBF2;border:2px solid #0B7A45;border-radius:14px;padding:8px 12px;margin-top:10px;color:#0B7A45;font-size:17px}
.done-box img{width:84px;height:56px;object-fit:cover;border-radius:8px;margin-right:10px;border:2px solid #0B7A45}
.done-box .t{flex:1;color:#1C2340;font-weight:700;overflow:hidden;max-height:3em}
.tips{margin:10px 0 0;padding:0;list-style:none}
.tips li{font-size:16px;background:#F7F8FC;border-radius:10px;padding:6px 10px;margin-top:6px}
details{margin-top:12px}
summary{font-family:'Jua',sans-serif;font-size:19px;cursor:pointer;color:#1E5BD8}
/* 투표 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:12px;gap:12px;margin-top:10px}
.w{border:3px solid #DDE1EC;border-radius:16px;background:#fff;padding:6px;text-align:left;cursor:pointer;position:relative}
.w.mine{border-color:#C2410C;box-shadow:0 0 0 3px #FFD9C2}
.w img{display:block;width:100%;height:100px;object-fit:cover;border-radius:10px}
.w .tx{height:100px;overflow:hidden;font-size:14px;line-height:1.45;background:#F7F8FC;border-radius:10px;padding:6px 8px}
.w .lb{font-size:15px;margin-top:4px}
.w .pick-mark{position:absolute;right:8px;top:8px;background:#C2410C;color:#fff;border-radius:999px;padding:0 10px;font-family:'Jua',sans-serif;font-size:16px}
.empty{color:#4A5170;font-size:17px;text-align:center;padding:16px 0}
/* 크게 보기 */
.modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(21,27,58,.72);z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.modal.on{display:block}
.modal .box{background:#fff;max-width:760px;margin:24px auto;border-radius:22px;padding:18px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;border:0;background:#EEF0F6;border-radius:999px;width:46px;height:46px;font-size:24px}
.modal .ba{margin-top:10px}
.modal .ba h3{margin:12px 0 6px;font-size:20px}
.modal .ba img{display:block;width:100%;border-radius:14px;border:2px solid #1C2340}
.modal .ba .full{white-space:pre-wrap;font-size:17px;line-height:1.6;background:#F7F8FC;border-radius:14px;padding:10px 12px;max-height:340px;overflow:auto}
/* 알림 */
#toast{position:fixed;left:50%;bottom:24px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#1C2340;color:#fff;border-radius:999px;padding:12px 22px;font-size:18px;z-index:60;opacity:0;pointer-events:none;-webkit-transition:opacity .25s;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
body.docked #toast{bottom:150px}
.btn.go{display:block;width:100%;margin:12px 0 0;background:#1E5BD8;font-size:24px;padding:14px 18px}
.btn.go .ico{width:1.2em;height:1.2em;vertical-align:-.22em;margin-right:4px}
.subbtns{display:flex;justify-content:center;margin-top:6px}
.subbtns button,.subbtns a{background:none;border:0;color:#1E5BD8;font-size:16px;text-decoration:underline;margin:0 10px;padding:8px 4px;cursor:pointer;font-weight:700}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid #1C2340;box-shadow:0 -6px 18px rgba(28,35,64,.18);padding:10px 16px 12px;display:none}
#dock.on{display:block}
#dock .in{max-width:780px;margin:0 auto;display:flex;align-items:center}
#dock .pv{flex:1;min-width:0;font-size:15px;line-height:1.4;max-height:2.8em;overflow:hidden;margin-right:12px;color:#1C2340}
#dock .pv b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:#C2410C}
#dock .btn{margin:0;flex:none;background:#1E5BD8;font-size:20px;padding:10px 16px;min-height:48px}
.flash{-webkit-animation:fl 1.2s ease 2;animation:fl 1.2s ease 2}
@-webkit-keyframes fl{50%{box-shadow:0 0 0 6px #FFE58A}}
@keyframes fl{50%{box-shadow:0 0 0 6px #FFE58A}}
.wait{text-align:center;padding:40px 0}
.wait .big{font-size:40px;margin:10px 0}
.spin{display:inline-block;width:46px;height:46px;border:6px solid #DDE1EC;border-top-color:#C2410C;border-radius:50%;-webkit-animation:sp 1s linear infinite;animation:sp 1s linear infinite}
@-webkit-keyframes sp{to{-webkit-transform:rotate(360deg)}}
@keyframes sp{to{transform:rotate(360deg)}}
.final-tag{display:inline-block;background:#1E5BD8;color:#fff;border-radius:8px;padding:0 8px;font-size:14px;margin-left:6px}
@media (max-width:520px){h1{font-size:28px}.oneline{font-size:24px}.card{padding:14px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand d">AI 잘 쓰면, 나도 잘 된다!</div><div class="who" id="who"></div></div></header>

<main class="wrap">
  <!-- 입장 -->
  <section class="scr" id="scr-join">
    <h1 class="d">반가워요!</h1>
    <p class="lead">큰 화면에 보이는 입장 코드와 반·번호를 넣어요. 이름은 받지 않아요.</p>
    <div class="card">
      <div class="field"><label for="in-code">입장 코드 (숫자 4개)</label><input id="in-code" class="code-in" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>
      <div class="two">
        <div class="field"><label for="in-cls">반</label><select id="in-cls"></select></div>
        <div class="field"><label for="in-num">번호</label><select id="in-num"></select></div>
      </div>
      <button class="btn big" id="btn-join">시작하기</button>
      <div class="msg" id="join-msg"></div>
    </div>
  </section>

  <!-- 기다리기 -->
  <section class="scr" id="scr-wait">
    <div class="wait"><div class="spin"></div><div class="big d">곧 시작해요</div><p class="lead">선생님이 미션을 열면 이 화면이 저절로 바뀌어요.</p></div>
  </section>

  <!-- 미션 -->
  <section class="scr" id="scr-mission">
    <div class="mtabs" id="mtabs"></div>
    <div id="mission"></div>
  </section>

  <!-- 반 대표 대결 -->
  <section class="scr" id="scr-final">
    <div class="mtabs" id="mtabs2"></div>
    <h1 class="d">반 대표 대결!</h1>
    <p class="lead">반마다 오늘 표를 가장 많이 받은 작품이에요. 눌러서 크게 보고, 가장 좋은 작품에 한 표!</p>
    <div class="card"><div class="grid" id="final-grid"></div><div class="msg" id="final-msg"></div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box"><button class="x" id="modal-x" aria-label="닫기">&times;</button><div id="modal-body"></div></div></div>
<div id="dock"><div class="in"><div class="pv" id="dock-pv"></div><button class="btn" id="dock-go">복사하고 제미나이</button></div></div>
<div id="toast"></div>

<script>
(function () {
'use strict';
/* =========================================================
   미션 메뉴 (수업 설계: wip/ai-prompt-class/docs/수업_설계.md)
   보기: 문자열 하나면 그 글자 그대로, {l: 칩에 보일 말, t: 프롬프트에 들어갈 말}
   틀: {칸} 은 고른 말, {칸|을/를} 처럼 쓰면 받침에 맞춰 조사를 붙여요
   ========================================================= */
var COLORS = ['#F2B48C', '#A9C8E8', '#A6D8D2', '#A8CDB3', '#EDB3BF', '#F3D899', '#BEB0E3'];
var GEMINI = 'https://gemini.google.com/app';
var MISSIONS = {
  1: {
    name: '몽타주', ing: '디테일', type: 'img', subject: 'who',
    goal: '상상한 그대로 그림 받기',
    before: '{who} 그려줘',
    tpl: '{style|으로/로}, {wear} {who|이/가} {place}에서 {act} 모습을 {mood} 느낌으로 그려줘.',
    slots: [
      { k: 'who', l: '주인공', items: ['고양이', '강아지', '펭귄', '햄스터', '공룡', '로봇', '토끼', '북극곰', '판다', '수달'] },
      { k: 'wear', l: '옷차림·소품', items: [{ l: '교복', t: '교복을 입은' }, { l: '우주복', t: '우주복을 입은' }, { l: '요리사 모자', t: '요리사 모자를 쓴' }, { l: '헤드폰', t: '헤드폰을 쓴' }, { l: '노란 우비', t: '노란 우비를 입은' }, { l: '왕관', t: '왕관을 쓴' }, { l: '안경과 책가방', t: '안경을 쓰고 책가방을 멘' }, { l: '축구 유니폼', t: '축구 유니폼을 입은' }, { l: '마법사 망토', t: '마법사 망토를 두른' }, { l: '한복', t: '한복을 입은' }] },
      { k: 'place', l: '장소', items: ['학교 매점', '우주 정거장', '바닷속', '도서관', '비 오는 편의점 앞', '놀이공원', '눈 덮인 산꼭대기', '교실 맨 뒷자리', '떡볶이 가게', '무대 위'] },
      { k: 'act', l: '행동·표정', items: [{ l: '마지막 빵 보고 놀란', t: '마지막 남은 빵을 보고 놀란' }, { l: '시험지 보고 좌절한', t: '시험지를 보고 좌절한' }, { l: '신나게 춤추는', t: '신나게 춤추는' }, { l: '졸려서 하품하는', t: '졸려서 하품하는' }, { l: '컵라면 먹으며 행복한', t: '컵라면을 먹으며 행복한' }, { l: '친구와 하이파이브', t: '친구와 하이파이브하는' }, { l: '간식 먹다 들킨', t: '몰래 간식을 먹다 들킨' }, { l: '노래 부르는', t: '노래 부르는' }, { l: '셀카 찍는', t: '셀카 찍는' }, { l: '숙제하다 머리 싸맨', t: '숙제하다 머리를 싸맨' }] },
      { k: 'style', l: '그림체', items: ['웹툰 그림체', '픽셀 아트', '수채화', '클레이 애니메이션', '스티커', '3D 애니메이션', '동화책 삽화', '레고 블록', '크레파스 그림', '따뜻한 애니메이션'] },
      { k: 'mood', l: '분위기', items: ['밝고 알록달록한', '노을빛', '밤하늘과 반짝이는 불빛', '파스텔 톤', '흑백'] }
    ],
    tips: ['그림이 거절되면: 사람 → 동물로 바꿔요', '‘사실적인’ 대신 ‘귀여운 일러스트’로 써요', '무서운 단어는 빼요', '캐릭터 이름 대신 생김새로 설명해요'],
    more: ['배경을 밤으로 바꿔 줘', '표정을 더 웃기게 해 줘', '옆에 친구 한 마리 추가해 줘', '그림체를 픽셀 아트로 바꿔 줘', '소품 하나 더 들려 줘']
  },
  2: {
    name: '세계관 요리', ing: '상황', type: 'text', subject: 'food',
    goal: '내 상황에 딱 맞는 답 받기',
    before: '{food} 만드는 법 알려줘',
    tpl: '나는 {world}에 있어. {have} {limit} {food} 만드는 법 알려줘.',
    slots: [
      { k: 'food', l: '음식', items: ['라면', '김밥', '떡볶이', '주먹밥', '토스트', '샌드위치', '계란후라이', '팬케이크', '과일 화채', '핫초코'] },

}

/* 틀에 고른 말을 넣어 글자와 HTML(형광 밑줄)을 만들어요 */
function build(m, tpl) {

  var parts = tpl.split(/(\{[^}]+\})/);
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (!/^\{.+\}$/.test(p)) { plain += p; html += esc(p); continue; }
    var a = p.slice(1, -1).split('|'), k = a[0], v = slotText(m, k);
    var sl = null; for (var j = 0; j < M.slots.length; j++) if (M.slots[j].k === k) sl = M.slots[j];
    if (!v) {

      missing.push(label);
      plain += '[' + label + ']'; html += '<span class="miss">[' + esc(label) + ']</span>';
      if (a[1]) { var j2 = a[1].split('/')[1]; plain += j2; html += esc(j2); }

function copyText(text, el, done) {
  done = done || function (ok) { if (ok) toast('복사했어요! 제미나이 입력칸에 붙여 넣어요'); };
  function manual() {
    if (el && window.getSelection) {

    }

    done(false);
  }
  function fallback() {

    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, 99999); } catch (e) {}

    document.body.removeChild(ta);
    return ok;

      return;
    }

  if (fallback()) done(true); else manual();
}

/* 사진 줄이기: 원본은 긴 변 1280px, 작은 그림은 320px */
function prepImage(file, cb) {
  var fr = new FileReader();
  fr.onerror = function () { cb(null); };
  fr.onload = function () {
    var img = new Image();
    img.onerror = function () { cb(null); };
    img.onload = function () {
      try {
        var full = shrink(img, 1280, 0.82), thumb = shrink(img, 320, 0.6);
        if (thumb.length > 44000) thumb = shrink(img, 240, 0.5);
        cb({ image: full.split(',')[1], thumb: thumb });
      } catch (e) { cb(null); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function shrink(img, max, q) {
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, k = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

  var fd = feedData[m] || (feedData[m] = { cursor: 0, byNum: {}, counts: {}, hidden: [] });
  var cur = {}; cur[S.cls] = fd.cursor;
  call('feed', [m, cur], function (res) {
    if (!res || !res.classes) return;
    var c = res.classes[S.cls];
    if (c) {
      c.rows.forEach(function (r) { fd.byNum[r.num] = fd.byNum[r.num] || {}; fd.byNum[r.num][r.kind] = r; });
      fd.cursor = c.cursor;
    }
    fd.hidden = res.hidden || [];
    if (view === m) renderVotes(m);
  });
}
function renderVotes(m) {
  var g = $('vote-grid'); if (!g) return;
  var s = mine[m] || {}, fd = feedData[m];
  if (!s.after) { g.innerHTML = ''; return; }
  if (!fd) { g.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  var nums = [], h = '';
  for (var n in fd.byNum) if (fd.byNum[n].after && +n !== S.num && fd.hidden.indexOf(m + '-' + S.cls + '-' + n) < 0) nums.push(+n);
  nums.sort(function (a, b) { return a - b; });
  if (!nums.length) { g.innerHTML = '<div class="empty">아직 올린 친구가 없어요. 조금만 기다려요!</div>'; return; }
  for (var i = 0; i < nums.length; i++) {
    var w = fd.byNum[nums[i]], a = w.after, picked = String(s.vote) === String(nums[i]);
    h += '<button class="w' + (picked ? ' mine' : '') + '" data-n="' + nums[i] + '">' + (picked ? '<span class="pick-mark">내 한 표</span>' : '') +
      (a.type === 'img' ? '<img src="' + esc(a.thumb) + '" alt="' + nums[i] + '번 작품">' : '<div class="tx">' + esc(a.text.slice(0, 120)) + '</div>') +
      '<div class="lb">' + S.cls + '반 ' + nums[i] + '번</div></button>';
  }
  g.innerHTML = h;
  var bs = g.getElementsByTagName('button');
  for (i = 0; i < bs.length; i++) bs[i].onclick = function () { openWork(m, +this.getAttribute('data-n')); };
}
function baHtml(before, after) {
  function one(lab, r) {
    if (!r) return '<h3 class="d">' + lab + '</h3><div class="empty">아직 안 올렸어요</div>';
    if (r.type === 'img') return '<h3 class="d">' + lab + '</h3><img src="' + esc(r.fileId ? 'https://drive.google.com/thumbnail?id=' + r.fileId + '&sz=w1200' : r.thumb) + '" onerror="this.onerror=null;this.src=\'' + esc(r.thumb) + '\'" alt="' + lab + '">';
    return '<h3 class="d">' + lab + '</h3><div class="full">' + esc(r.text) + '</div>';
  }
  return '<div class="ba">' + one('Before', before) + one('After', after) + '</div>';
}
function openWork(m, n) {
  var w = feedData[m].byNum[n], s = mine[m] || {};
  var h = '<h2 class="d" style="margin:0 46px 0 0;font-size:26px">' + S.cls + '반 ' + n + '번 · 미션 ' + m + '</h2>' + baHtml(w.before, w.after);
  h += '<button class="btn big" id="btn-vote">' + (String(s.vote) === String(n) ? '이미 이 작품에 투표했어요' : '이 작품에 한 표!') + '</button>';
  openModal(h);
  $('btn-vote').onclick = function () {
    var b = this; b.disabled = true; b.textContent = '투표하는 중…';
    call('vote', [S.cls, S.num, m, n], function (res) {
      if (!res || !res.ok) { b.disabled = false; b.textContent = '이 작품에 한 표!'; toast((res && res.msg) || '다시 시도해 주세요.'); return; }
      mine[m].vote = String(n); closeModal(); renderVotes(m); toast(n + '번 작품에 한 표! 바꾸고 싶으면 다른 작품을 눌러요', 3000);
    }, function () { b.disabled = false; b.textContent = '이 작품에 한 표!'; toast('투표하지 못했어요. 다시 눌러 주세요.'); });
  };
}
function openModal(h) { $('modal-body').innerHTML = h; $('modal').className = 'modal on'; }
function closeModal() { $('modal').className = 'modal'; $('modal-body').innerHTML = ''; }
$('modal-x').onclick = closeModal;
$('modal').onclick = function (e) { if (e.target === this) closeModal(); };

/* ---------------- 반 대표 대결 ---------------- */
var finalData = null, myFinal = null;
function openFinal() {
  view = 0;
  show('scr-final');
  $('mtabs2').innerHTML = tabsHtml('F'); bindTabs($('mtabs2'));
  call('getFinal', [], function (res) { finalData = res; renderFinal(); });
  call('myStatus', [S.cls, S.num, 1], function (res) { if (res) { myFinal = res.finalVote; renderFinal(); } });
}
function renderFinal() {
  var g = $('final-grid');
  if (!finalData) { g.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  if (!finalData.open || !finalData.list.length) { g.innerHTML = '<div class="empty">곧 대결 작품이 나와요.</div>'; return; }
  var h = '';
  finalData.list.forEach(function (w) {
    var a = w.after || {}, picked = myFinal === w.key;
    h += '<button class="w' + (picked ? ' mine' : '') + '" data-k="' + esc(w.key) + '">' + (picked ? '<span class="pick-mark">내 한 표</span>' : '') +
      (a.type === 'img' ? '<img src="' + esc(a.thumb) + '" alt="">' : '<div class="tx">' + esc((a.text || '').slice(0, 120)) + '</div>') +
      '<div class="lb">' + w.cls + '반 대표<span class="final-tag">미션 ' + w.mission + '</span></div></button>';
  });
  g.innerHTML = h;
  var bs = g.getElementsByTagName('button');
  for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { openFinalWork(this.getAttribute('data-k')); };
}
function openFinalWork(key) {
  var w = null; finalData.list.forEach(function (x) { if (x.key === key) w = x; });
  if (!w) return;
  var own = w.cls === S.cls && w.num === S.num;
  openModal('<h2 class="d" style="margin:0 46px 0 0;font-size:26px">' + w.cls + '반 대표 · 미션 ' + w.mission + ' ' + esc(MISSIONS[w.mission].name) + '</h2>' + baHtml(w.before, w.after) +
    (own ? '<div class="empty">내 작품이에요!</div>' : '<button class="btn big" id="btn-fvote">' + (myFinal === key ? '이미 이 작품에 투표했어요' : '이 작품에 한 표!') + '</button>'));
  var b = $('btn-fvote'); if (!b) return;
  b.onclick = function () {
    b.disabled = true;
    call('voteFinal', [S.cls, S.num, key], function (res) {
      if (!res || !res.ok) { b.disabled = false; toast((res && res.msg) || '다시 시도해 주세요.'); return; }
      myFinal = key; closeModal(); renderFinal(); toast('한 표 완료! 큰 화면을 봐요', 3000);
    }, function () { b.disabled = false; toast('투표하지 못했어요. 다시 눌러 주세요.'); });
  };
}

/* ---------------- 몇 초마다 확인 ---------------- */
function pollState() {
  call('getState', [], function (st) { applyState(st, false); }, function () {});
  setTimeout(pollState, 7000 + Math.random() * 4000);
}
function pollLoop() {
  if (S.cls && view && document.visibilityState !== 'hidden') pollFeed();
  setTimeout(pollLoop, 9000 + Math.random() * 4000);
}
document.addEventListener('visibilitychange', function () {
  // 제미나이에 다녀오면 바로 새 상태를 확인해요
  if (document.visibilityState === 'visible' && S.cls) call('getState', [], function (st) { applyState(st, false); }, function () {});
  if (document.visibilityState === 'visible' && lastGo && view === lastGo.m) {
    var k = lastGo.kind, box = $('up-' + k); lastGo = null;
    if (box && !(mine[view] && mine[view][k])) {
      setTimeout(function () {
        if (box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        box.className = 'upload flash';
        toast('결과를 받았으면 여기에서 ' + (k === 'before' ? 'Before' : 'After') + ' 올리기!', 3500);
      }, 300);
    }
  }
});

/* ---------------- 시작 ---------------- */
renderWho();
if (S.cls) {
  show('scr-wait');
  call('getState', [], function (st) { applyState(st, true); }, function () { toast('연결이 안 돼요. 와이파이를 확인해 주세요.', 4000); });
} else openJoin();
setTimeout(pollState, 6000);
setTimeout(pollLoop, 8000);
})();
</script>
